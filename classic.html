<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雪原孤亭 · 极寒之境</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #9fa9b4; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  .hud {
    position: fixed; z-index: 10; color: #eef2f6;
    font-family: "Songti SC", "STSong", "SimSun", serif;
    text-shadow: 0 1px 8px rgba(20, 28, 38, .55);
    pointer-events: none; user-select: none;
  }
  .title { top: 28px; left: 32px; }
  .title h1 { font-size: 30px; font-weight: 600; letter-spacing: 10px; }
  .title p  { margin-top: 8px; font-size: 13px; letter-spacing: 4px; opacity: .75; }
  .hint {
    bottom: 22px; left: 50%; transform: translateX(-50%);
    font-size: 12px; letter-spacing: 3px; opacity: .6;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .panel {
    position: fixed; z-index: 10; right: 24px; bottom: 22px;
    display: flex; flex-direction: column; gap: 10px; align-items: flex-end;
    font-family: -apple-system, "PingFang SC", sans-serif;
  }
  .panel button {
    padding: 8px 18px; font-size: 13px; letter-spacing: 2px; cursor: pointer;
    color: #eef2f6; background: rgba(30, 40, 52, .45);
    border: 1px solid rgba(238, 242, 246, .35); border-radius: 20px;
    backdrop-filter: blur(6px); transition: all .2s;
  }
  .panel button:hover { background: rgba(30, 40, 52, .7); }
  .panel .slider-box {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px; border-radius: 20px;
    background: rgba(30, 40, 52, .45); border: 1px solid rgba(238,242,246,.35);
    backdrop-filter: blur(6px); color: #eef2f6; font-size: 12px; letter-spacing: 2px;
  }
  .panel input[type=range] { width: 110px; accent-color: #cfd8e0; cursor: pointer; }

  #loading {
    position: fixed; inset: 0; z-index: 99; display: flex;
    align-items: center; justify-content: center;
    background: linear-gradient(#6b7683, #9fa9b4);
    color: #eef2f6; font-family: "Songti SC", serif;
    font-size: 18px; letter-spacing: 8px; transition: opacity .8s;
  }
  #loading.done { opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="loading">风雪将至 …</div>
<div id="app"></div>

<div class="hud title">
  <h1>雪原孤亭</h1>
  <p>极 寒 之 境 · 风 雪 交 加</p>
</div>
<div class="hud hint">拖 拽 旋 转 · 滚 轮 缩 放 · 右 键 平 移</div>

<div style="position:fixed;z-index:10;left:24px;bottom:22px;"><a href="./index.html" style="color:#eef2f6;font-size:12px;letter-spacing:2px;text-decoration:none;padding:8px 18px;border-radius:20px;background:rgba(30,40,52,.45);border:1px solid rgba(238,242,246,.35);backdrop-filter:blur(6px);font-family:-apple-system,sans-serif;">📷 返回照片级全景版</a></div>
<div class="panel">
  <div class="slider-box">
    <span>风暴强度</span>
    <input id="storm" type="range" min="0.3" max="1.8" step="0.05" value="0.65">
  </div>
  <button id="soundBtn">🔇 开启风声</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/controls/OrbitControls.js": "./lib/OrbitControls.js"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
